<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Smart City</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        🏙️  <b>SMART CITY</b>
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" class="active">Contact</a>

    </nav>

</header>


<section class="page-banner">

    <h1>Contact Us</h1>

    <p>We would love to hear from you</p>

</section>


<section class="section">

    <div class="contact-container">


        <div class="contact-info">

            <h2>Get In Touch</h2>

            <p>
                Have a question or suggestion?
                Send us a message.
            </p>

            <div class="contact-item">
                📍 <b>Address</b>
                <p> our city</p>
            </div>

            <div class="contact-item">
                📞 <b>Phone</b>
                <p>+91 9854 xxx xxx</p>
            </div>

            <div class="contact-item">
                📧 <b>Email</b>
                <p>info@smartcity.com</p>
            </div>

        </div>


        <form id="contactForm">

            <h2>Send Message</h2>

            <input
                type="text"
                id="name"
                placeholder="Your Name"
                required>

            <input
                type="email"
                id="email"
                placeholder="Your Email"
                required>

            <input
                type="text"
                id="subject"
                placeholder="Subject"
                required>

            <textarea
                id="message"
                placeholder="Your Message"
                rows="6"
                required></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

            <p id="formMessage"></p>

        </form>

    </div>

</section>


<footer>

    <div class="copyright">
        © 2026  Smart City Information
    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
